<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Mani Linkha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- F1 Page Transition Overlay -->
    <div class="transition-overlay">
        <img src="images/f1car.png" class="f1-car" alt="F1 Racing Car">
    </div>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">MANI LINKHA</div>
        <ul>
            <li><a href="index.html" data-direction="right">Home</a></li>
            <li><a href="education.html" data-direction="left">Education</a></li>
            <li><a href="projects.html" data-direction="right">Projects</a></li>
            <li><a href="contact.html" data-direction="left">Contact</a></li>
        </ul>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- Skills Content -->
    <section class="page-section">
        <h1 class="page-title">Skills</h1>
        <div class="skills-grid">
            <div class="skill-card">
                <h3>HTML</h3>
                <div class="progress">
                    <span style="width:90%"></span>
                </div>
            </div>
            <div class="skill-card">
                <h3>CSS</h3>
                <div class="progress">
                    <span style="width:85%"></span>
                </div>
            </div>
            <div class="skill-card">
                <h3>JavaScript</h3>
                <div class="progress">
                    <span style="width:75%"></span>
                </div>
            </div>
            <div class="skill-card">
                <h3>Cybersecurity</h3>
                <div class="progress">
                    <span style="width:70%"></span>
                </div>
            </div>
            <div class="skill-card">
                <h3>AWS Cloud</h3>
                <div class="progress">
                    <span style="width:60%"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Client-Side Scripts -->
    <script src="script.js"></script>
</body>
</html>
